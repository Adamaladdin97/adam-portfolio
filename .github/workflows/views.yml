name: Refresh view counts
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:
permissions:
  contents: write
jobs:
  views:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/update_views.py
      - name: Commit if changed
        run: |
          git config user.name "views-bot"
          git config user.email "views-bot@users.noreply.github.com"
          git add assets/data/views.json
          git diff --cached --quiet || (git commit -m "Update view counts" && git push)

<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project — ADAM ALADDIN</title>
    <meta name="description" content="Project case study by Adam Aladdin.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=202610231618">
</head>
<body class="bg-grain antialiased selection:bg-white selection:text-black">
    <div id="site-nav"></div>

    <main class="max-w-7xl mx-auto px-5 md:px-6 pt-28 md:pt-36">
        <a href="work.html" class="link-arrow mb-8 md:mb-10">← All projects</a>
        <div id="project-head" class="mb-10 md:mb-12"></div>
        <div id="project-facts"></div>
        <div id="project-chapters"></div>
        <div id="project-flat" class="hidden">
            <p class="eyebrow mb-5 md:mb-6">Deliverables · <span id="deliv"></span></p>
            <div id="project-grid"></div>
        </div>
        <div id="project-nav" class="mt-16 grid grid-cols-1 sm:grid-cols-2 gap-5 md:gap-6"></div>
    </main>

    <div id="site-footer"></div>
    <script src="data.js?v=202610231618"></script>
    <script src="common.js?v=202610231618"></script>
    <script>

        renderChrome('work');

        /* ---------- Visual layout manager (reorder / hide chapters & steps) ----------
           Shown on localhost, or on any device after opening the page once with ?admin=1 (?admin=0 turns it off).
           The arrangement is saved in this browser's localStorage only; "Export order" gives JSON to paste back to Claude. */
        function initLayoutManager(p) {
            const KEY = 'layout:' + p.slug, host = $('project-chapters');
            const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
            let layout = {};
            try { layout = JSON.parse(store.get(KEY)) || {}; } catch (e) {}
            const q = new URLSearchParams(location.search).get('admin');
            if (q === '1') store.set('admin', '1'); else if (q === '0') store.del('admin');
            const local = /^(localhost|127\.0\.0\.1|\[::1\]|.*\.local)$/.test(location.hostname);
            const admin = local || store.get('admin') === '1';
            LM.on = admin;
            const render = () => { const y = scrollY; host.innerHTML = ''; renderEditorial(host, p, layout); scrollTo(0, y); };
            render();
            if (!admin) return;

            const save = () => { store.set(KEY, JSON.stringify(layout)); render(); draw(); };
            const parentOf = (mid) => mid.replace(/m\d+$/, '');
            const findParent = (pid) => { const cur = state(); for (const ch of cur) { if (ch.id === pid) return ch.media; for (const s of ch.steps) if (s.id === pid) return s.media; } return []; };
            LM.move = (mid, d) => {                                   // swap with the neighbour of the same kind, so the move is visible
                const pid = parentOf(mid), list = findParent(pid).filter(x => !x.hidden), i = list.findIndex(x => x.id === mid);
                const key = groupKey(list[i].m), same = list.filter(x => groupKey(x.m) === key), k = same.findIndex(x => x.id === mid), nb = same[k + d];
                if (!nb) return;
                const ids = findParent(pid).map(x => x.id), a = ids.indexOf(mid), b = ids.indexOf(nb.id);
                [ids[a], ids[b]] = [ids[b], ids[a]];
                layout.media = layout.media || {}; layout.media[pid] = ids; save();
            };
            LM.hide = (mid) => { toggle(mid); save(); };
            LM.large = (mid) => { const s = new Set(layout.large || []); s.has(mid) ? s.delete(mid) : s.add(mid); layout.large = [...s]; save(); };
            const state = () => resolveLayout(p, layout);
            const flat = (arr) => arr.map(x => x.id);
            const move = (ids, id, d) => { const i = ids.indexOf(id), j = i + d; if (j < 0 || j >= ids.length) return ids; const o = [...ids]; [o[i], o[j]] = [o[j], o[i]]; return o; };
            const toggle = (id) => { const h = new Set(layout.hidden || []); h.has(id) ? h.delete(id) : h.add(id); layout.hidden = [...h]; };
            const mediaExport = (list) => list.map(x => ({ item: ((x.m.title ? x.m.title + ' · ' : '') + (x.m.thumbnail || x.m.full || '').split('/').pop()).trim(), ...(x.hidden ? { hidden: true } : {}), ...(x.large ? { large: true } : {}) }));
            const exportJSON = () => JSON.stringify({ slug: p.slug, chapters: state().map(ch => ({ title: ch.c.title, hidden: ch.hidden, ...(ch.steps.length ? { steps: ch.steps.map(s => ({ title: s.st.title, hidden: s.hidden, media: mediaExport(s.media) })) } : { media: mediaExport(ch.media) }) })) }, null, 2);

            const wrap = document.createElement('div');
            wrap.className = 'fixed left-4 bottom-4 z-[45] font-sans';
            document.body.appendChild(wrap);
            let open = store.get('layout-open') === '1';
            const ctl = (act, label, ch, off) => `<button data-act="${act}" aria-label="${label}" ${off ? 'disabled' : ''} class="w-7 h-7 rounded-md border border-white/10 text-neutral-300 hover:bg-white hover:text-black transition disabled:opacity-25 disabled:hover:bg-transparent disabled:hover:text-neutral-300 text-xs">${ch}</button>`;
            const eye = (hid) => hid ? '<svg class="w-4 h-4 mx-auto" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 6.1A10 10 0 0112 6c5 0 9 6 9 6a17 17 0 01-3.2 3.7M6.6 6.7A17 17 0 003 12s4 6 9 6c1.4 0 2.7-.3 3.9-.8"/></svg>' : '<svg class="w-4 h-4 mx-auto" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M3 12s4-6 9-6 9 6 9 6-4 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.5"/></svg>';
            function row(id, title, hid, i, n, indent) {
                return `<div data-id="${id}" class="flex items-center gap-1.5 py-1 ${indent ? 'pl-5' : ''} ${hid ? 'opacity-45' : ''}">
                    ${ctl('up', 'Move up', '↑', i === 0)}${ctl('down', 'Move down', '↓', i === n - 1)}${ctl('eye', hid ? 'Show' : 'Hide', eye(hid))}
                    <span dir="auto" class="${indent ? 'text-[11px] text-neutral-400' : 'text-xs text-white'} truncate ml-1 ${hid ? 'line-through' : ''}" title="${esc(title)}">${esc(title)}</span></div>`;
            }
            function draw() {
                const st = state();
                const hiddenItems = st.flatMap(ch => [...ch.media, ...ch.steps.flatMap(s => s.media)]).filter(x => x.hidden);
                wrap.innerHTML = open ? `
                    <div class="w-[320px] max-w-[calc(100vw-2rem)] rounded-2xl border border-white/15 bg-[rgba(14,16,20,0.96)] backdrop-blur-md shadow-2xl shadow-black/60">
                        <div class="flex items-center justify-between px-4 py-3 border-b border-white/10">
                            <span class="eyebrow !text-[10px]">Layout manager</span>
                            <button data-act="close" aria-label="Close" class="text-neutral-400 hover:text-white text-xs">✕</button>
                        </div>
                        <div class="px-3 py-2 max-h-[52vh] overflow-y-auto">
                            ${st.map((ch, i) => row(ch.id, ch.c.title, ch.hidden, i, st.length, false) + ch.steps.map((s, j) => row(s.id, s.st.title, s.hidden, j, ch.steps.length, true)).join('')).join('')}
                        </div>
                        ${hiddenItems.length ? `<div class="px-3 py-2 border-t border-white/10 max-h-[18vh] overflow-y-auto"><p class="eyebrow !text-[10px] mb-2">Hidden items (${hiddenItems.length})</p>${hiddenItems.map(x => `<div data-id="${x.id}" class="flex items-center gap-2 py-1"><img src="${esc(x.m.thumbnail || x.m.full)}" alt="" class="w-7 h-7 rounded object-cover border border-white/10"><span class="text-[11px] text-neutral-400 truncate flex-1">${esc(x.m.title || (x.m.thumbnail || x.m.full || '').split('/').pop())}</span><button data-act="eye" class="px-2 py-1 rounded-full border border-white/15 text-[10px] text-white hover:bg-white hover:text-black transition">Show</button></div>`).join('')}</div>` : ''}
                        <div class="flex gap-2 px-3 py-3 border-t border-white/10">
                            <button data-act="export" class="flex-1 px-3 py-2 rounded-full bg-white text-black text-[10px] uppercase tracking-widest font-medium hover:bg-neutral-200 transition">Export order</button>
                            <button data-act="reset" class="px-3 py-2 rounded-full border border-white/15 text-white text-[10px] uppercase tracking-widest hover:bg-white/10 transition">Reset</button>
                        </div>
                        <p id="lm-msg" class="px-4 pb-3 text-[10px] text-neutral-500 -mt-1">Saved in this browser only.</p>
                    </div>` : `<button data-act="open" class="px-4 py-2.5 rounded-full border border-white/15 bg-[rgba(14,16,20,0.92)] backdrop-blur-md text-[10px] uppercase tracking-widest text-white hover:bg-white hover:text-black transition shadow-lg shadow-black/50">⚙ Layout</button>`;
            }
            wrap.addEventListener('click', (e) => {
                const b = e.target.closest('[data-act]'); if (!b) return;
                const act = b.dataset.act, rowEl = b.closest('[data-id]'), id = rowEl && rowEl.dataset.id;
                if (act === 'open' || act === 'close') { open = act === 'open'; store.set('layout-open', open ? '1' : '0'); return draw(); }
                if (act === 'reset') { layout = {}; store.del(KEY); render(); return draw(); }
                if (act === 'export') {
                    const json = exportJSON(); console.log('Layout order for ' + p.slug + ':\n' + json);
                    try { navigator.clipboard.writeText(json); } catch (e) {}
                    const m = $('lm-msg'); if (m) m.textContent = 'Copied + printed in the console — paste it to Claude.'; return;
                }
                const isStep = /^c\d+s\d+$/.test(id), cid = isStep ? id.split('s')[0] : id, cur = state();
                if (act === 'eye') toggle(id);
                else if (!isStep) layout.order = move(flat(cur), id, act === 'up' ? -1 : 1);
                else { layout.steps = layout.steps || {}; layout.steps[cid] = move(flat(cur.find(c => c.id === cid).steps), id, act === 'up' ? -1 : 1); }
                save();
            });
            draw();
        }

        const slug = new URLSearchParams(location.search).get('p');
        const idx = PROJECTS.findIndex(p => p.slug === slug);
        if (idx < 0) { location.replace('work.html'); }
        else {
            const p = PROJECTS[idx], cat = catById(p.category);
            document.title = `${p.title} — ADAM ALADDIN`;
            $('project-head').innerHTML = `
                <p dir="auto" class="eyebrow mb-3">${esc(p.client)}</p>
                <h1 dir="auto" class="font-serif text-4xl md:text-6xl text-white leading-tight mb-5">${esc(p.title)}</h1>
                ${p.description ? `<p dir="auto" class="text-neutral-400 text-sm md:text-base font-light leading-relaxed max-w-2xl mb-6">${esc(p.description)}</p>` : ''}
                <div class="flex flex-wrap gap-2">
                    <span class="px-3 py-1.5 rounded-md bg-white/10 border border-white/10 text-xs text-white">${esc(cat ? cat.label : p.category)}</span>
                    ${accountChip(p)}
                    ${(p.scope || []).map(t => `<span class="px-3 py-1.5 rounded-md bg-white/5 border border-white/5 text-xs text-neutral-300">${esc(t)}</span>`).join('')}
                </div>`;
            $('project-facts').innerHTML = factsHTML(p) + highlightsHTML(p);
            const chapters = p.chapters || [];
            if (chapters.some(c => (c.media && c.media.length) || (c.steps && c.steps.length))) {
                initLayoutManager(p);
            } else {
                if (chapters.length) {
                    const n = chapters.length;
                    $('project-chapters').innerHTML = `<div class="grid grid-cols-1 ${n > 1 ? 'md:grid-cols-2' : ''} gap-5 md:gap-6 mb-12 md:mb-14">` + chapters.map((c, i) => `
                        <div class="luxury-card rounded-2xl p-6 md:p-8"><p class="text-xs font-mono text-neutral-500 mb-3">${String(i + 1).padStart(2, '0')}</p>
                        <h3 dir="auto" class="font-serif text-2xl text-white mb-3">${esc(c.title)}</h3>
                        <p dir="auto" class="text-sm text-neutral-400 font-light leading-relaxed">${esc(c.text)}</p></div>`).join('') + '</div>';
                }
                $('project-flat').classList.remove('hidden');
                $('deliv').textContent = deliverablesText(p);
                $('project-grid').appendChild(mediaGrids(p, p.media));
            }

            const nav = (q, dir) => `<a href="project.html?p=${encodeURIComponent(q.slug)}" class="luxury-card rounded-2xl p-6 flex flex-col gap-2 group ${dir === 'next' ? 'sm:text-right' : ''}">
                <span class="eyebrow">${dir === 'next' ? 'Next project →' : '← Previous project'}</span>
                <span dir="auto" class="font-serif text-2xl text-white group-hover:underline">${esc(q.title)}</span></a>`;
            const prev = PROJECTS[(idx - 1 + PROJECTS.length) % PROJECTS.length], next = PROJECTS[(idx + 1) % PROJECTS.length];
            $('project-nav').innerHTML = nav(prev, 'prev') + nav(next, 'next');
        }

    </script>
</body>
</html>

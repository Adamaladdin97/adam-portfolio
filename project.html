<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project — ADAM ALADDIN</title>
    <meta name="description" content="Project case study by Adam Aladdin.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-grain antialiased selection:bg-white selection:text-black">
    <div id="site-nav"></div>

    <main class="max-w-7xl mx-auto px-5 md:px-6 pt-28 md:pt-36">
        <a href="work.html" class="link-arrow mb-8 md:mb-10">← All projects</a>
        <div id="project-head" class="mb-10 md:mb-12"></div>
        <div id="project-story"></div>
        <p class="eyebrow mb-5 md:mb-6">Deliverables · <span id="deliv"></span></p>
        <div id="project-grid"></div>
        <div id="project-nav" class="mt-16 grid grid-cols-1 sm:grid-cols-2 gap-5 md:gap-6"></div>
    </main>

    <div id="site-footer"></div>
    <script src="data.js"></script>
    <script src="common.js"></script>
    <script>

        renderChrome('work');

        const slug = new URLSearchParams(location.search).get('p');
        const idx = PROJECTS.findIndex(p => p.slug === slug);
        if (idx < 0) { location.replace('work.html'); }
        else {
            const p = PROJECTS[idx], cat = catById(p.category);
            document.title = `${p.title} — ADAM ALADDIN`;
            $('project-head').innerHTML = `
                <p dir="auto" class="eyebrow mb-3">${esc(p.client)}</p>
                <h1 dir="auto" class="font-serif text-4xl md:text-6xl text-white leading-tight mb-5">${esc(p.title)}</h1>
                ${p.description ? `<p dir="auto" class="text-neutral-400 text-sm md:text-base font-light leading-relaxed max-w-2xl mb-6">${esc(p.description)}</p>` : ''}
                <div class="flex flex-wrap gap-2">
                    <span class="px-3 py-1.5 rounded-md bg-white/10 border border-white/10 text-xs text-white">${esc(cat ? cat.label : p.category)}</span>
                    ${(p.scope || []).map(t => `<span class="px-3 py-1.5 rounded-md bg-white/5 border border-white/5 text-xs text-neutral-300">${esc(t)}</span>`).join('')}
                </div>`;
            $('project-story').innerHTML = storyHTML(p);
            $('deliv').textContent = deliverablesText(p);
            const grid = $('project-grid');
            grid.className = GRID;
            const layout = mediaLayout(p);
            p.media.forEach((m, i) => grid.appendChild(mediaCard(p, m, layout[i])));

            const nav = (q, dir) => `<a href="project.html?p=${encodeURIComponent(q.slug)}" class="luxury-card rounded-2xl p-6 flex flex-col gap-2 group ${dir === 'next' ? 'sm:text-right' : ''}">
                <span class="eyebrow">${dir === 'next' ? 'Next project →' : '← Previous project'}</span>
                <span dir="auto" class="font-serif text-2xl text-white group-hover:underline">${esc(q.title)}</span></a>`;
            const prev = PROJECTS[(idx - 1 + PROJECTS.length) % PROJECTS.length], next = PROJECTS[(idx + 1) % PROJECTS.length];
            $('project-nav').innerHTML = nav(prev, 'prev') + nav(next, 'next');
        }

    </script>
</body>
</html>
